name: Push Markdown to Profile README

on:
  push:
    paths:
      - 'posts/**.md'  # md 파일 변경 시 실행
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout next.js-tech-blog repository
        uses: actions/checkout@v3

      - name: Checkout profile repo
        uses: actions/checkout@v3
        with:
          repository: kos5667/kos5667
          token: ${{ secrets.BLOG_TOKEN }}
          path: profile

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run update profile README
        run: npx ts-node scripts/updateReadme.ts

      - name: Update README in profile repository
        run: |
          cp profile.md README.md
          git config user.name "kos5667"
          git config user.email "kos5667@gmail.com"
          git add README.md
          git commit -m "블로그 문서 목록 갱신" || echo "No changes"
          git push
